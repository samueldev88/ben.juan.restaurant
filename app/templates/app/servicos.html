{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reservas — Ben Juan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="{% static 'restaurante/css/style.css' %}" rel="stylesheet">
<style>
  .welcome{ margin:26px 20px 0; text-align:center; }
  .welcome p{ margin:0; font-size:14.5px; color:var(--muted); }
  .welcome h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:600; font-size:31px; line-height:1.1;
    color:var(--ink); margin:6px 0 0; text-wrap:balance;
  }
  .services{ margin:24px 20px 0; display:flex; flex-direction:column; gap:12px; }
  .service{
    display:flex; align-items:center; gap:16px;
    padding:18px 16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--ink);
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .15s ease, transform .15s ease;
  }
  .service:hover{ border-color:var(--navy); transform:translateY(-2px); }
  .service:focus-visible{ outline:2px solid var(--navy); outline-offset:3px; }
  .service__icon{
    width:46px; height:46px; border-radius:12px;
    background:rgba(201,162,77,.18); color:var(--navy);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .service__icon svg{ width:24px; height:24px; }
  .service__t{ font-family:'Poppins', sans-serif; font-weight:600; font-size:15.5px; }
  .service__d{ font-size:13px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .service__go{ margin-left:auto; color:var(--muted); flex-shrink:0; }
  .service__go svg{ width:16px; height:16px; }
</style>
</head>
<body class="pg-reserva">

<div class="phone">

  {% include 'app/_topo.html' %}

  <section class="welcome">
    <p>Bem-vindo ao Ben Juan!</p>
    <h1>Qual serviço você deseja utilizar?</h1>
  </section>

  <nav class="services" aria-label="Serviços">

    <a class="service" href="{% url 'reserva_mesa' %}">
      <span class="service__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </span>
      <span>
        <div class="service__t">Fazer reserva de mesa</div>
        <div class="service__d">Escolha a data e venha ao restaurante</div>
      </span>
      <span class="service__go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

    <a class="service" href="{% url 'reserva_espera' %}">
      <span class="service__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </span>
      <span>
        <div class="service__t">Entrar na lista de espera</div>
        <div class="service__d">Avisamos quando sua mesa estiver pronta</div>
      </span>
      <span class="service__go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

    <a class="service" href="{% url 'index' %}#projetos">
      <span class="service__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5c-3.5-.5-6.5 0-8.5 1.5zM12 6.5v13"/></svg>
      </span>
      <span>
        <div class="service__t">Veja o cardápio</div>
        <div class="service__d">Cardápio digital Ben Juan</div>
      </span>
      <span class="service__go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

  </nav>

</div>

</body>
</html>
