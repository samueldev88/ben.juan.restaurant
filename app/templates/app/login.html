{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Ben Juan Restaurant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'restaurante/css/style.css' %}" rel="stylesheet">
    <style>
        body{
            background-color: var(--cream);
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
        }
        .auth-card{
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.4);
            padding: 36px;
            max-width: 400px;
            width: 100%;
        }
        .auth-card h1{
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 22px;
        }
        .form-label{ color: var(--muted); font-size: 13.5px; }
        .form-control{
            background: var(--cream);
            border: 1px solid var(--border);
            color: var(--ink);
        }
        .form-control:focus{
            background: var(--cream);
            color: var(--ink);
            border-color: var(--navy);
            box-shadow: 0 0 0 .2rem rgba(201,162,77,0.25);
        }
        .btn-order{
            background: var(--navy);
            color: var(--navy-deep) !important;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border-radius: 999px;
            padding: 10px 20px;
            border: none;
        }
        .btn-order:hover{ background: var(--amber); }
        a{ color: var(--navy); }
        .alert-danger{
            background: rgba(216,80,60,0.15);
            border: 1px solid var(--coral);
            color: var(--ink);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Entrar</h1>

        {% if form.errors %}
            <div class="alert alert-danger">Usuário ou senha incorretos.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-order w-100">Entrar</button>
        </form>

        <p class="mt-3 mb-0 text-center">
            Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </p>
        <p class="mt-2 mb-0 text-center">
            <a href="{% url 'index' %}">&larr; Voltar ao site</a>
        </p>
    </div>
</body>
</html>
